<!doctype html>
<!-- Source for site/assets/img/social-card-diyas.jpg (1200 x 630), the WhatsApp/link preview.
     Rendered by tools/make_images.py. Not published. Text stays near the centre,
     because some apps crop the card to a square. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/assets/css/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0B1026; }
  .photo {
    position: absolute; inset: 0; width: 1200px; height: 630px;
    object-fit: cover; object-position: 50% 62%;
  }
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(8, 10, 30, 0.88) 0%, rgba(8, 10, 30, 0.6) 34%, rgba(8, 10, 30, 0) 62%),
      radial-gradient(ellipse at 50% 30%, rgba(8, 10, 30, 0.35), rgba(8, 10, 30, 0) 60%);
  }
  .words { position: relative; z-index: 1; padding-top: 34px; text-align: center; }
  .eyebrow { margin: 0 0 6px; font-size: 18px; letter-spacing: 0.3em; }
  .headline { margin: 0; font-size: 104px; line-height: 1.05; text-shadow: 0 0 28px rgba(255, 178, 74, 0.55), 0 2px 6px rgba(0, 0, 0, 0.6); }
  .hindi { margin: 6px 0 0; font-size: 38px; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7); }
</style>
</head>
<body>
  <img class="photo" src="../site/assets/photos/diyas-bokeh.webp" alt="">
  <div class="shade"></div>
  <div class="words">
    <p class="eyebrow">A LIGHT FROM MY HOME TO YOURS</p>
    <h1 class="headline">Happy Diwali</h1>
    <p class="hindi" lang="hi">दीपावली की हार्दिक शुभकामनाएँ</p>
  </div>
</body>
</html>
